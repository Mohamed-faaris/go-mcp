<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>go-mcp Browser Bridge settings</title><style>body{font:14px system-ui;max-width:620px;margin:40px auto;padding:0 20px;background:#0a0a0a;color:#eee}label{display:block;margin:18px 0 6px}input{box-sizing:border-box;width:100%;padding:10px;background:#171717;border:1px solid #404040;border-radius:6px;color:#fff}button{margin-top:18px;padding:10px 16px;border:0;border-radius:6px;background:#fff;color:#111;cursor:pointer}p{color:#a3a3a3;line-height:1.5}#saved{color:#86efac}</style></head><body><h1>Browser bridge connection</h1><p>Enter the same random token configured as BROWSER_BRIDGE_TOKEN for the MCP server. The bridge listens on loopback only.</p><label for="url">Bridge WebSocket URL</label><input id="url" value="ws://127.0.0.1:8765/bridge"><label for="token">Shared secret token</label><input id="token" type="password" autocomplete="off" placeholder="At least 32 random characters"><button id="save">Save and connect</button><p id="saved"></p><script src="options.js"></script></body></html>
